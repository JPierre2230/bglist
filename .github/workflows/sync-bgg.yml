name: Sync BoardGameGeek collection

on:
  schedule:
    - cron: "0 19 * * *"     # every day at 03:00 Taiwan time
  workflow_dispatch:          # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: bgg-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch collection from BGG
        env:
          BGG_USERNAME: ${{ vars.BGG_USERNAME }}
          BGG_TOKEN: ${{ secrets.BGG_TOKEN }}
        run: |
          if [ -z "$BGG_TOKEN" ] || [ -z "$BGG_USERNAME" ]; then
            echo "BGG_TOKEN or BGG_USERNAME isn't set yet; skipping sync. See README step 3."
            exit 0
          fi
          python scripts/sync_bgg.py

      - name: Commit updated data
        run: |
          if git diff --quiet -- data/games.json; then
            echo "Collection unchanged."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data/games.json
          git commit -m "Sync BGG collection"
          git push
